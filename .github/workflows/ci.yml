name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/ -q

  cgm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    defaults:
      run:
        working-directory: cgm-framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cgm-framework/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest cgm/ -q

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.mjs
      - run: npm run docs:build

  release-ready:
    name: Main release ready
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [monitor, cgm, website]
    runs-on: ubuntu-latest
    steps:
      - name: Mark the checked main revision as eligible
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          echo "All source checks passed for $RELEASE_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo 'The Ansätze host polls this successful main workflow every two minutes, builds the same revision, drains active work, and publishes with health checks and rollback.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review approval alone does not deploy unmerged code. Host rollout status is recorded in /opt/ansatze/deployment-status.json.' >> "$GITHUB_STEP_SUMMARY"
