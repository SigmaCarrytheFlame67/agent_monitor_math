[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgm"
version = "0.1.0"
description = "Ansatz: Continual Graph Memory for mathematical research agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["mathematics", "proof-search", "multi-agent", "llm", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# The truth layer (cgm.core) is pure standard library. Per-module third-party
# deps are declared as optional extras below and pulled in as each module lands
# (see ARCHITECTURE.md).
dependencies = []

[project.optional-dependencies]
# mcp is pinned to 1.x: 2.x removed mcp.server.fastmcp (FastMCP moved to the
# standalone `fastmcp` package), which the MCP services import.
gateway = ["mcp>=1.2,<2"]                                 # cgm.gateway — role-gated MCP server
write-paper = ["mcp>=1.2,<2"]                             # cgm.write_paper   — write-paper MCP service
human-summary = ["mcp>=1.2,<2"]                           # cgm.human_summary — human-summary MCP service
verify = ["fastapi", "uvicorn", "pydantic"]         # cgm.verify  — cold-start verifier HTTP service
observability = ["fastapi", "uvicorn", "pydantic"]  # cgm.observability — read-only dashboard
strategy = ["openai", "anthropic"]                  # cgm.strategy — API consult transports
dev = ["pytest", "mcp>=1.2,<2", "fastapi", "uvicorn", "pydantic", "openai", "anthropic"]  # full test suite (all modules)

[tool.setuptools.packages.find]
include = ["cgm*"]

[tool.setuptools.package-data]
"cgm.core" = ["*.json"]
